[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "derivatives-pricing-engine"
version = "0.1.0"
description = "A typed, tested option pricing library with pluggable models, a CLI, and a REST API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "William Hetzinger", email = "wchetzinger11@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
dev = [
    "derivatives-pricing-engine[api]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pricing-engine = "pricing_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["pricing_engine"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Hypothesis passes each generated input as a positional argument.
"tests/test_properties.py" = ["PLR0917"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pricing_engine"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
